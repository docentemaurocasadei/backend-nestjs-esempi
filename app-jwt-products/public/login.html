<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Hamburgeria</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #1a1a1a; }
    .brand { color: #ff6b35; font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
    .card { background: #2a2a2a; border: none; }
    .card-body { color: #f0f0f0; }
    .form-control { background: #333; border-color: #444; color: #f0f0f0; }
    .form-control:focus { background: #333; border-color: #ff6b35; color: #f0f0f0; box-shadow: 0 0 0 .2rem rgba(255,107,53,.25); }
    .form-control::placeholder { color: #888; }
    .form-label { color: #aaa; }
    .btn-burger { background: #ff6b35; border: none; color: #fff; font-weight: 600; }
    .btn-burger:hover { background: #e55a24; color: #fff; }
  </style>
</head>
<body class="d-flex align-items-center" style="min-height:100vh">

  <div class="container" style="max-width:420px">
    <div class="text-center mb-4">
      <div class="brand">🍔 Hamburgeria</div>
      <small class="text-secondary">Area riservata</small>
    </div>

    <div class="card shadow-lg">
      <div class="card-body p-4">
        <div id="alert" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input id="username" class="form-control" placeholder="Username" value="admin" />
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input id="password" class="form-control" type="password" placeholder="Password" value="password" />
        </div>
        <button class="btn btn-burger w-100" onclick="login()">Entra</button>
      </div>
    </div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');

      alertEl.classList.add('d-none');

      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!response.ok) {
        alertEl.textContent = 'Credenziali non valide';
        alertEl.classList.remove('d-none');
        return;
      }

      const data = await response.json();
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      window.location.href = 'products.html';
    }
  </script>
</body>
</html>
