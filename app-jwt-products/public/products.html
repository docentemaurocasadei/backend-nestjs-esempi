<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu – Hamburgeria</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #1a1a1a; color: #f0f0f0; }
    .navbar-brand { color: #ff6b35 !important; font-weight: 800; font-size: 1.4rem; }
    .card { background: #2a2a2a; border: none; color: #f0f0f0; transition: transform .15s; }
    .card:hover { transform: translateY(-4px); }
    .card-footer { background: #222; border-top: 1px solid #333; }
    .price { color: #ff6b35; font-size: 1.1rem; }
    .btn-burger { background: #ff6b35; border: none; color: #fff; font-weight: 600; }
    .btn-burger:hover { background: #e55a24; color: #fff; }
    .card-img-top { object-fit: cover; height: 180px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4" style="border-bottom: 3px solid #ff6b35">
    <div class="container">
      <span class="navbar-brand">🍔 Hamburgeria</span>
      <button class="btn btn-outline-warning btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div id="alert" class="alert alert-danger d-none"></div>
    <div id="products" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
  </div>

  <template id="card-tpl">
    <div class="col">
      <div class="card h-100 shadow">
        <img src="" alt="" class="card-img-top product-image" />
        <div class="card-body">
          <h5 class="card-title product-name"></h5>
          <p class="card-text text-secondary product-description"></p>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
          <span class="price fw-bold product-price"></span>
          <a href="#" class="btn btn-burger btn-sm product-link">Dettaglio</a>
        </div>
      </div>
    </div>
  </template>

  <script>
    function imgPath(p) {
      return p ? '/' + p : null;
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('refresh_token');
      if (!refreshToken) return false;

      const response = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });

      if (!response.ok) return false;

      const data = await response.json();
      localStorage.setItem('access_token', data.access_token);
      return true;
    }

    async function fetchWithAuth(url) {
      let accessToken = localStorage.getItem('access_token');

      if (!accessToken) { window.location.href = 'login.html'; return null; }

      let response = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });

      if (response.status === 401) {
        const refreshed = await refreshAccessToken();
        if (!refreshed) { window.location.href = 'login.html'; return null; }

        accessToken = localStorage.getItem('access_token');
        response = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
      }

      return response;
    }

    async function loadProducts() {
      const response = await fetchWithAuth('/products');

      if (!response || !response.ok) {
        const alertEl = document.getElementById('alert');
        alertEl.textContent = 'Errore nel caricamento dei prodotti';
        alertEl.classList.remove('d-none');
        return;
      }

      const products = await response.json();
      const container = document.getElementById('products');
      const tpl = document.getElementById('card-tpl');

      products.forEach(product => {
        const clone = tpl.content.cloneNode(true);

        const img = clone.querySelector('.product-image');
        const src = imgPath(product.image_path);
        if (src) {
          img.src = src;
          img.alt = product.name;
        } else {
          img.remove();
        }

        clone.querySelector('.product-name').textContent = product.name;
        clone.querySelector('.product-description').textContent = product.description ?? '';
        clone.querySelector('.product-price').textContent = '€ ' + (product.price ?? product.base_price ?? '');
        clone.querySelector('.product-link').href = `product.html?id=${product.id}`;
        container.appendChild(clone);
      });
    }

    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      window.location.href = 'login.html';
    }

    loadProducts();
  </script>
</body>
</html>
