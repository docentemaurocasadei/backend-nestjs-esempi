<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dettaglio – Hamburgeria</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #1a1a1a; color: #f0f0f0; }
    .navbar-brand { color: #ff6b35 !important; font-weight: 800; font-size: 1.4rem; }
    .card { background: #2a2a2a; border: none; color: #f0f0f0; }
    .card-img-top { object-fit: cover; max-height: 360px; }
    .price { color: #ff6b35; font-size: 1.4rem; font-weight: 700; }
    dt { color: #aaa; }
    hr { border-color: #444; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4" style="border-bottom: 3px solid #ff6b35">
    <div class="container">
      <span class="navbar-brand">🍔 Hamburgeria</span>
      <div class="d-flex gap-2">
        <a href="products.html" class="btn btn-outline-secondary btn-sm">&#8592; Menu</a>
        <button class="btn btn-outline-warning btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width:640px">
    <div id="alert" class="alert alert-danger d-none"></div>
    <div id="product"></div>
  </div>

  <template id="detail-tpl">
    <div class="card shadow">
      <img src="" alt="" class="card-img-top product-image" />
      <div class="card-body p-4">
        <h3 class="product-name mb-1"></h3>
        <p class="text-secondary product-description mb-3"></p>
        <hr />
        <div class="price product-price mb-3"></div>
        <dl class="row mb-0">
          <dt class="col-sm-3">ID</dt>
          <dd class="col-sm-9 product-id"></dd>
          <dt class="col-sm-3">SKU</dt>
          <dd class="col-sm-9 product-sku"></dd>
        </dl>
      </div>
    </div>
  </template>

  <script>
    function imgPath(p) {
      return p ? '/' + p : null;
    }

    async function refreshAccessToken() {
      const refreshToken = localStorage.getItem('refresh_token');

      const response = await fetch('/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });

      if (!response.ok) return false;

      const data = await response.json();
      localStorage.setItem('access_token', data.access_token);
      return true;
    }

    async function fetchWithAuth(url) {
      let accessToken = localStorage.getItem('access_token');

      let response = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });

      if (response.status === 401) {
        const refreshed = await refreshAccessToken();
        if (!refreshed) { window.location.href = 'login.html'; return null; }

        accessToken = localStorage.getItem('access_token');
        response = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
      }

      return response;
    }

    async function loadProduct() {
      const id = new URLSearchParams(window.location.search).get('id');
      const alertEl = document.getElementById('alert');

      if (!id) {
        alertEl.textContent = 'ID prodotto mancante';
        alertEl.classList.remove('d-none');
        return;
      }

      const response = await fetchWithAuth(`/products/${id}`);

      if (!response || !response.ok) {
        alertEl.textContent = 'Prodotto non trovato';
        alertEl.classList.remove('d-none');
        return;
      }

      // il service ritorna un array di righe
      const [product] = await response.json();

      const tpl = document.getElementById('detail-tpl');
      const clone = tpl.content.cloneNode(true);

      const img = clone.querySelector('.product-image');
      const src = imgPath(product.image_path);
      if (src) {
        img.src = src;
        img.alt = product.name;
      } else {
        img.remove();
      }

      clone.querySelector('.product-name').textContent = product.name;
      clone.querySelector('.product-description').textContent = product.description ?? '';
      clone.querySelector('.product-price').textContent = '€ ' + (product.price ?? product.base_price ?? '');
      clone.querySelector('.product-id').textContent = product.id;
      clone.querySelector('.product-sku').textContent = product.sku ?? '—';

      document.getElementById('product').appendChild(clone);
    }

    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      window.location.href = 'login.html';
    }

    loadProduct();
  </script>
</body>
</html>
