<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Prodotti</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="root" class="container py-5">
        <div class="row g-4">

            <div class="col-12 col-lg-4">
                <div id="list-categories" class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h5 mb-0">Elenco Categorie</h2>
                    </div>
                    <div class="card-body">
                        <!-- categorie -->
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div id="list-products" class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h2 class="h5 mb-0">Elenco Prodotti</h2>
                    </div>
                    <div class="card-body">
                        <!-- prodotti -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <template id="category-template">
        <div class="card mb-3 border-0 bg-light">
            <div class="card-body">
                <h5 class="card-title" id="name"></h5>
                <p class="card-text text-muted mb-1" id="description"></p>
                <span class="badge bg-secondary" id="slug"></span>
            </div>
        </div>
    </template>

    <template id="product-template">
        <div class="card mb-4 shadow-sm">
            <img src="" alt="" id="image" class="card-img-top img-fluid">

            <div class="card-body">
                <h5 class="card-title" id="name"></h5>
                <p class="card-text text-muted" id="description"></p>

                <div class="mb-2">
                    <span class="badge bg-secondary" id="slug"></span>
                    <span class="badge bg-dark" id="sku"></span>
                </div>

                <p class="fw-bold text-success mb-2" id="base_price"></p>
                <span class="badge bg-success" id="is_active"></span>
            </div>
        </div>
    </template>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
