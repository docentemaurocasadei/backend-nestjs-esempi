<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Burger Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Burger Menu</a>
            <a id="createButton" class="btn btn-primary d-none" href="/product-edit.html">
                + Inserisci prodotto
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="mb-4">
            <h1 class="fw-bold">Catalogo burger</h1>
            <p class="text-muted">Clicca sull’immagine per aprire la scheda prodotto.</p>
        </div>

        <div id="products" class="row g-4"></div>
    </main>
    <template id="productCardTemplate">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card product-card h-100 shadow-sm border-0">
        <a class="product-link" href="#">
            <img class="card-img-top product-image" src="" alt="">
        </a>

        <div class="card-body">
            <h2 class="h5 card-title product-name"></h2>
            <p class="card-text text-muted product-description"></p>
            <p class="fw-bold fs-5 mb-0">
            € <span class="product-price"></span>
            </p>

            <div class="admin-buttons mt-3 d-flex gap-2 d-none">
            <a class="btn btn-sm btn-outline-primary edit-link" href="#">Modifica</a>
            <button class="btn btn-sm btn-outline-danger delete-button">Elimina</button>
            </div>
        </div>
        </div>
    </div>
    </template>
    <script type="module" src="/index.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            loadProducts();
        });
    </script>

</body>

</html>
