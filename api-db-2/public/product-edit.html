<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Gestione prodotto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Burger Admin</a>
            <a class="btn btn-outline-secondary" href="/">Torna alla lista</a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h1 class="fw-bold">Gestione prodotto</h1>
            <p class="text-muted">Pagina tecnica per inserimento, modifica ed eliminazione.</p>
        </div>

        <div id="flash" style="display:none"></div>

        <form id="productForm" class="card shadow-sm border-0">
            <div class="card-body p-4">

                <input type="hidden" id="id">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input class="form-control" id="name" type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label">Slug</label>
                    <input class="form-control" id="slug" type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrizione</label>
                    <textarea class="form-control" id="description" rows="4"></textarea>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label">Prezzo base</label>
                        <input class="form-control" id="base_price" type="number" step="0.01">
                    </div>

                    <div class="col-12 col-md-6 mb-3">
                        <label class="form-label">SKU</label>
                        <input class="form-control" id="sku" type="text">
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button id="deleteButton" type="button" class="btn btn-danger d-none">
                        Elimina
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Salva
                    </button>
                </div>

            </div>
        </form>

    </main>

    <script type="module" src="/index.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            const id = new URLSearchParams(location.search).get('id');

            if (!hasAuth()) {
                location.href = '/';
                return;
            }

            if (id) {
                loadProductForm(id);
                document.getElementById('deleteButton').classList.remove('d-none');
            }

            document.getElementById('productForm').addEventListener('submit', function (e) {
                e.preventDefault();
                saveProduct(id);
            });

            document.getElementById('deleteButton').addEventListener('click', function () {
                deleteProduct(id);
            });
        });
    </script>

</body>

</html>
