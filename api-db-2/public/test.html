<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Hello, world!</h1>

    <template id="productCardTemplate">
        <div class="card" style="width: 18rem;">
            <img src="..." class="card-img-top" alt="..." id="product-image" class="w-100">
            <div class="card-body">
                <h5 class="card-title" id="product-name">Card title</h5>
                <p class="card-text" id="product-description">Some quick example text to build on the card title and
                    make up the bulk of the card’s content.</p>
                <a href="#" class="btn btn-primary">Go somewhere</a>
            </div>
        </div>
    </template>
    <div id="product-template">

    </div>
    <script>
        fetch('http://localhost:3000/api/products')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Errore nella richiesta');
                }
                return response.json();
            })
            .then(products => {
                const container = document.getElementById('product-template');
                const template = document.getElementById('productCardTemplate');

                products.forEach(product => {
                    // Clona il template per ogni prodotto
                    const clone = template.content.cloneNode(true);

                    // Trova gli elementi da modificare nel clone
                    const imageElement = clone.querySelector('#product-image');
                    const nameElement = clone.querySelector('#product-name');
                    const descriptionElement = clone.querySelector('#product-description');

                    // Imposta i valori
                    if (product.image_path) {
                        imageElement.src = 'http://localhost:3000/' + product.image_path;
                    }
                    nameElement.textContent = product.name;
                    descriptionElement.textContent = product.description;

                    // Aggiungi il clone al contenitore
                    container.appendChild(clone);
                });
            })
            .catch(error => {
                console.error('Errore:', error);
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
