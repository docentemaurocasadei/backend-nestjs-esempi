<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Products Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <section id="login-section" class="panel auth-panel">
      <div class="brand-mark">JWT</div>
      <p class="eyebrow">Area riservata</p>
      <h1>Gestione prodotti</h1>
      <p class="section-copy">Accedi con le credenziali di esempio per provare login JWT e CRUD protetto.</p>
      <form id="login-form" class="form">
        <label>
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Accedi</button>
      </form>
      <p id="login-message" class="message"></p>
    </section>

    <section id="products-section" class="workspace hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>Prodotti</h1>
          <p class="section-copy">CRUD protetto con JWT salvato in localStorage.</p>
        </div>
        <button id="logout-button" type="button" class="secondary">Logout</button>
      </header>

      <section class="panel form-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Editor</p>
            <h2 id="form-title">Nuovo prodotto</h2>
          </div>
        </div>
        <form id="product-form" class="form product-form">
          <input id="product-id" type="hidden">
          <label>
            <span>Nome</span>
            <input id="product-name" type="text" required>
          </label>
          <label>
            <span>Descrizione</span>
            <textarea id="product-description" rows="3" required></textarea>
          </label>
          <label>
            <span>Prezzo</span>
            <input id="product-price" type="number" min="0" step="0.01" required>
          </label>
          <div class="actions">
            <button type="submit">Salva</button>
            <button id="cancel-edit-button" type="button" class="secondary hidden">Annulla modifica</button>
          </div>
        </form>
        <p id="product-message" class="message"></p>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Inventario</p>
            <h2>Elenco prodotti</h2>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Descrizione</th>
                <th>Prezzo</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
