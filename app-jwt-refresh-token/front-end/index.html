<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Demo JWT Refresh Token</title>
</head>
<body>
  <h1>Demo JWT + Refresh Token</h1>

  <h2>Login</h2>

  <input id="username" value="admin" placeholder="username" />
  <input id="password" value="123456" placeholder="password" type="password" />

  <button onclick="login()">Login</button>

  <h2>Post</h2>

  <button onclick="getPosts()">Carica tutti i post</button>
  <button onclick="insertPost()">Inserisci post</button>

  <h2>Messaggi</h2>
  <pre id="log"></pre>

  <script>
    const API_URL = 'http://localhost:3000';

    let accessToken = null;
    let refreshToken = null;

    function writeLog(message) {
        document.getElementById('log').textContent += message + '\n';
        setTimeout(() => {
          const logElement = document.getElementById('log');
          logElement.textContent = '';
        }, 10000);
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      if (!response.ok) {
        writeLog('Login fallito');
        return;
      }

      const data = await response.json();

      accessToken = data.access_token;
      refreshToken = data.refresh_token;

      writeLog('Token ottenuto. Scadenza access token: 1 minuto');
    }

    async function getPosts() {
      const response = await fetch(`${API_URL}/posts`);

      if (!response.ok) {
        writeLog('Errore nel caricamento dei post');
        return;
      }

      const posts = await response.json();

      writeLog('Lista post:');
      writeLog(JSON.stringify(posts, null, 2));
    }

    async function refreshAccessToken() {
      const response = await fetch(`${API_URL}/auth/refresh`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          refresh_token: refreshToken
        })
      });

      if (!response.ok) {
        writeLog('Refresh token scaduto. Devi rifare login.');
        throw new Error('Refresh token non valido');
      }

      const data = await response.json();

      accessToken = data.access_token;
      refreshToken = data.refresh_token;

      writeLog('Token scaduto, token rigenerato');
    }

    async function apiFetch(url, options = {}) {
      let response = await fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`
        }
      });

      if (response.status === 401) {
        await refreshAccessToken();

        response = await fetch(url, {
          ...options,
          headers: {
            ...(options.headers || {}),
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          }
        });
      }

      return response;
    }

    async function insertPost() {
      if (!accessToken) {
        writeLog('Prima devi fare login');
        return;
      }

      const response = await apiFetch(`${API_URL}/posts`, {
        method: 'POST',
        body: JSON.stringify({
          title: 'Post di test',
          content: 'Inserito da HTML + JS'
        })
      });

      if (response.ok) {
        writeLog('Post inserito');
      } else {
        writeLog('Errore inserimento post');
      }
    }
  </script>
</body>
</html>
